global:
  scrape_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: hdfc-ai-platform
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics_token   # same value as METRICS_TOKEN in .env
    static_configs:
      - targets: ["app:7860"]
