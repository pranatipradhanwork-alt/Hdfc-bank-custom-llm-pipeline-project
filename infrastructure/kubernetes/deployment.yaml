# Kubernetes definition for the HDFC AI Platform (defined and validated, not deployed in this capstone).
#
#   kubectl apply -f infrastructure/kubernetes/namespace.yaml
#   kubectl -n hdfc-ai create secret generic hdfc-ai-secrets \
#       --from-literal=HF_TOKEN=... --from-literal=APP_KEY=... --from-literal=METRICS_TOKEN=...
#   kubectl apply -f infrastructure/kubernetes/
#
# One replica: sessions, rate-limit counters and JSON records live in the pod. Scaling out needs them moved to
# Redis and PostgreSQL first (see README, production path).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hdfc-ai-platform
  namespace: hdfc-ai
  labels: { app: hdfc-ai-platform }
spec:
  replicas: 1
  strategy:
    type: Recreate        # the model-cache volume can only be attached to one pod at a time
  selector:
    matchLabels: { app: hdfc-ai-platform }
  template:
    metadata:
      labels: { app: hdfc-ai-platform }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "7860"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000        # same non-root user as the Dockerfile
        fsGroup: 1000
      containers:
        - name: app
          image: ghcr.io/hdfc-capstone/hdfc-ai-platform:1.0.0   # built from the repo Dockerfile and pushed to a registry
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 7860
          envFrom:
            - secretRef:
                name: hdfc-ai-secrets   # HF_TOKEN, APP_KEY, METRICS_TOKEN; never stored in the image or git
          env:
            - name: HF_HOME
              value: /cache/huggingface
            - name: REQUESTS_PER_MINUTE
              value: "20"
          resources:
            requests: { cpu: "2", memory: 10Gi }   # Llama 3.2 1B in float32 + FAQ index needs about 7 GB
            limits: { cpu: "4", memory: 12Gi }
          startupProbe:          # the first start downloads ~2.5 GB of model files
            httpGet: { path: /v1/health, port: 7860 }
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:        # only send traffic once the model is loaded
            httpGet: { path: /v1/health, port: 7860 }
            periodSeconds: 15
          livenessProbe:         # restart the pod if it stops answering
            httpGet: { path: /v1/health, port: 7860 }
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - name: model-cache
              mountPath: /cache
            - name: app-models
              mountPath: /home/user/app/models
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: hdfc-ai-model-cache
        - name: app-models
          emptyDir: {}
