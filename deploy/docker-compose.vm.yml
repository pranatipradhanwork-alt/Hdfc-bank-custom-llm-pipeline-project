# The review app on a single Linux VM (e.g. Oracle Cloud Always Free): the platform + Caddy for HTTPS.
# Guide: deploy/oracle-vm.md
#
#   cp .env.example .env      # then fill in HF_TOKEN, APP_KEY and SITE_ADDRESS
#   docker compose -f deploy/docker-compose.vm.yml up -d --build
#
# Caddy gets a free Let's Encrypt certificate for SITE_ADDRESS and forwards traffic to the app.

services:
  app:
    build: ..
    env_file: ../.env
    volumes:
      # Keep downloaded model files between restarts, so the 2.5 GB base model is fetched once
      - hf-cache:/home/user/.cache/huggingface
      - models:/home/user/app/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7860/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s  # first start downloads the model
    restart: unless-stopped

  caddy:
    image: caddy:2.10.2
    ports:
      - "80:80"
      - "443:443"
    env_file: ../.env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - app
    restart: unless-stopped

volumes:
  hf-cache:
  models:
  caddy-data:
