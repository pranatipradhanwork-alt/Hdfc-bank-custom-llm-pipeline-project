# Hugging Face pauses a Space on free CPU hardware after 48 hours without visitors, and the next visitor then waits
# several minutes for it to restart and reload the model. A daily health check keeps the review app awake.
name: keep-space-awake

on:
  schedule:
    - cron: "17 3 * * *"  # once a day, 03:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call the health check
        run: curl --fail --silent --show-error --max-time 600 --retry 3 --retry-delay 60 https://shyam003-hdfc-ai-platform.hf.space/v1/health
