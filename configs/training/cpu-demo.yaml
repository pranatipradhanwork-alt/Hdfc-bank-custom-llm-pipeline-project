hardware_platform: "cpu-inference-only"
base_model_name: "Qwen/Qwen2.5-0.5B-Instruct"
torch_dtype: "float32"
use_quantization: false
remote_worker_url: "https://internal.hdfc"
allow_local_training: true
lora:
  r: 16
  lora_alpha: 32
  target_modules: ["q_proj", "v_proj"]
  lora_dropout: 0.05
  bias: "none"
training_arguments:
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 1
  learning_rate: 2e-4
  num_train_epochs: 1
  weight_decay: 0.01
  logging_steps: 1
