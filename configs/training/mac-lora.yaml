hardware_platform: "mac-mps"
base_model_name: "Qwen/Qwen2.5-0.5B-Instruct"
torch_dtype: "float16"
use_quantization: false
lora:
  r: 16
  lora_alpha: 32
  target_modules: ["q_proj", "v_proj"]
  lora_dropout: 0.05
  bias: "none"
training_arguments:
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 2e-4
  num_train_epochs: 1
  weight_decay: 0.01
  logging_steps: 5
