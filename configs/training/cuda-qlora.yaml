hardware_platform: "cuda-qlora"
base_model_name: "meta-llama/Llama-3.2-1B-Instruct"
torch_dtype: "float16"
use_quantization: true
quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_use_double_quant: true
lora:
  r: 16
  lora_alpha: 32
  target_modules: ["q_proj", "v_proj"]
  lora_dropout: 0.05
  bias: "none"
training_arguments:
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 2
  learning_rate: 2e-4
  num_train_epochs: 3
  weight_decay: 0.01
  logging_steps: 10
